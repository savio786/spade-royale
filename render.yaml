# Render blueprint: New + > Blueprint > pick this repo. Serves the site and the multiplayer server together.
services:
  - type: web
    name: spade-royale
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /data
    disk:            # keeps the leaderboard and Wall of Fame across restarts and deploys
      name: spade-royale-data
      mountPath: /data
      sizeGB: 1
