# Builds the Android app on every push to main.
#  • spade-royale-android     → test APK you can install directly on a phone
#  • spade-royale-play-bundle → signed .aab to upload to the Google Play Console
#  • spade-royale-release-apk  → signed .apk for Samsung Galaxy Store and other Android stores
#    (needs the four ANDROID_* secrets in GitHub → Settings → Secrets and variables → Actions)
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Build the game (app version)
        run: npx vite build
        env:
          VITE_NATIVE_STORE: play
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: spade-royale-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Build the signed Play Store bundle
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload the Play Store bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spade-royale-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Upload the signed APK (Samsung Galaxy Store, Amazon, Huawei…)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spade-royale-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Check signing secrets
        if: env.HAS_KEY != 'true'
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          S4: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo "ANDROID_KEYSTORE_BASE64 found: $S1"
          echo "ANDROID_KEYSTORE_PASSWORD found: $S2"
          echo "ANDROID_KEY_ALIAS found: $S3"
          echo "ANDROID_KEY_PASSWORD found: $S4"
          echo "::notice::Signing secrets found -> KEYSTORE_BASE64=$S1 KEYSTORE_PASSWORD=$S2 KEY_ALIAS=$S3 KEY_PASSWORD=$S4"
