# Builds an installable Android test app (APK) on every push to main.
# Download it from GitHub → Actions → latest "Android app" run → Artifacts → spade-royale-android.
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android tools (preinstalled on GitHub's machines)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - name: Install
        run: npm ci
      - name: Build the game
        run: npx vite build
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: spade-royale-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
